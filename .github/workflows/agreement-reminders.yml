# Hourly driver for the unsigned-agreement reminder ladder.
#
# Runs here rather than in vercel.json because Vercel's own cron on this
# project's plan only accepts daily-or-longer schedules — which is why
# every sub-daily job in this repo (sync-ical, vacancy-pitch,
# acquisition-scan) is a workflow and only the monthly statement push is
# a Vercel cron. Adding an hourly entry to vercel.json fails the
# deployment outright.
#
# Hourly rather than daily because the cadence is anchored on each
# agreement's own sentAt and gated by the client's local quiet hours: a
# daily job would drift the "24 hour" reminder by up to a day and would
# fire every send at whatever single time the job happened to run.
#
# GitHub's scheduler can run late under load. That is fine here: a
# reminder is due for hours, not for a minute, and the next run picks up
# anything a late or missed run left behind.
#
# The manual trigger defaults to dry_run=true, which reports exactly
# which agreements are due and at which rung, without sending anything,
# claiming a step or raising a task. The scheduled run passes no input,
# so it sends for real.
#
# Safe to run repeatedly: each rung is claimed through a unique index on
# (agreementId, step), so a replay cannot re-email a client.

name: Agreement reminders

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report what would be sent, without sending it"
        type: boolean
        required: false
        default: true
      limit:
        description: "Max sends this run (default 50)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ping agreement-reminders endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          LIMIT: ${{ github.event.inputs.limit }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repo secret is not set"
            exit 1
          fi
          url="https://goldstay.co.ke/api/cron/agreement-reminders"
          sep="?"
          if [ "$DRY_RUN" = "true" ]; then
            url="${url}${sep}dryRun=1"
            sep="&"
          fi
          if [ -n "$LIMIT" ]; then
            url="${url}${sep}limit=${LIMIT}"
          fi
          echo "GET $url"
          response=$(curl -sS -o /tmp/body -w "%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "$url")
          echo "HTTP $response"
          cat /tmp/body
          if [ "$response" != "200" ]; then
            exit 1
          fi
